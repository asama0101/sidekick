<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 928 740" width="928" height="740" role="img" aria-labelledby="t d" font-family="Consolas, 'Cascadia Mono', 'MS Gothic', 'Noto Sans Mono CJK JP', monospace" font-size="15" style="white-space:pre">
  <title id="t">Sidekick のパネル（イメージ）</title>
  <desc id="d">左に Claude Code の会話と、入力欄の上の「サイドパネルの開閉」ボタン。右にパネル。パネルは上から、見出し（Session とモデル名 Sonnet 5.5 / high）、ディレクトリ、ブランチ名、ゴール、停止中の状態、コンテキスト（使用率 58%、色分けのバー、「▸ 凡例」）、自動 compact までの残りと「正確に数える」、5時間枠と 7日枠、タブの行（定型文・履歴・Git）、定型文の一覧 3 件の順に並ぶ。</desc>
