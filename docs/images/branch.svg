<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="t d" font-family="Consolas, 'Cascadia Mono', 'MS Gothic', 'Noto Sans Mono CJK JP', monospace" font-size="15" style="white-space:pre">
  <title id="t">「Git」タブ（イメージ）</title>
  <desc id="d">見出し「ブランチ 3」の下に、ローカルのフォルダとリモート（origin）、ブランチの一覧 3 行が並ぶ。一覧は、チェックアウト中の feat/login（マージ待ち）、fix/typo（次: push）、既定ブランチ main。選んだ feat/login の経過が 8 段階（ブランチを切る、編集、commit、push、PR、マージ、リリース、削除）で並ぶ。✓ は済み、● は今、○ はこれから。「マージ」の行が今の段階で、「マージ待ち」、PR のリンク「PR #35」、「▶ マージ済みを伝える」のボタンが出る。一番下に git と gh を最後に読んだ時刻が出る。</desc>
  <rect x="0" y="0" width="640" height="460" rx="10" fill="#1e1e1e"/>
  <rect x="0.5" y="0.5" width="639" height="459" rx="10" fill="none" stroke="#3c3c3c"/>
  <text x="24.0" y="36" fill="#d4d4d4" font-weight="bold">ブランチ 3</text>
  <text x="24.0" y="58" fill="#858585">💻 ローカル</text>
  <text x="131.0" y="58" fill="#d4d4d4">C:\project\my-app</text>
  <text x="24.0" y="80" fill="#858585">🌐 リモート</text>
  <text x="131.0" y="80" fill="#b1b9f9">origin</text>
  <text x="201.0" y="80" fill="#d4d4d4">github.com/example/my-app</text>
  <text x="24.0" y="124" fill="#6fcf97" font-weight="bold">＊feat feat/login  ↑2  マージ待ち</text>
  <text x="24.0" y="146" fill="#b1b9f9">　fix fix/typo  次: push</text>
  <text x="24.0" y="168" fill="#858585">　既定 main  既定</text>
  <text x="24" y="212" fill="#d4d4d4" font-weight="bold">feat/login</text>
  <text x="24" y="234" fill="#6fcf97">┌</text>
  <text x="48" y="234" fill="#6fcf97">✓ ブランチを切る</text>
  <text x="424" y="234" fill="#858585">11/18 10:02</text>
  <text x="24" y="256" fill="#6fcf97">├</text>
  <text x="48" y="256" fill="#6fcf97">✓ 編集</text>
  <text x="424" y="256" fill="#858585">11/18 10:30</text>
  <text x="24" y="278" fill="#6fcf97">├</text>
  <text x="48" y="278" fill="#6fcf97">✓ commit  3 件</text>
  <text x="424" y="278" fill="#858585">11/19 09:12</text>
  <text x="24" y="300" fill="#6fcf97">├</text>
  <text x="48" y="300" fill="#6fcf97">✓ push</text>
  <text x="424" y="300" fill="#858585">11/19 09:20</text>
  <text x="24" y="322" fill="#6fcf97">├</text>
  <text x="48" y="322" fill="#6fcf97">✓ PR</text>
  <text x="424" y="322" fill="#858585">11/19 09:25</text>
  <text x="24" y="344" fill="#e5c07b">├</text>
  <text x="48" y="344" fill="#e5c07b" font-weight="bold">● マージ  マージ待ち</text>
  <text x="324" y="344" fill="#b1b9f9">PR #35</text>
  <text x="424" y="344" fill="#b1b9f9" font-weight="bold">▶ マージ済みを伝える</text>
  <text x="24" y="366" fill="#858585">├</text>
  <text x="48" y="366" fill="#858585">○ リリース</text>
  <text x="24" y="388" fill="#858585">└</text>
  <text x="48" y="388" fill="#858585">○ 削除</text>
  <text x="24" y="432" fill="#858585">git 14:21:05 / gh 14:21:00</text>
</svg>
